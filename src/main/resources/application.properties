# 服务器端口
server.port=8080

# MySQL 数据源配置
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=041209
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# UTF-8 编码
